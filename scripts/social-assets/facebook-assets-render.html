<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thai People History Facebook Assets</title>
    <style>
      @font-face {
        font-family: "Noto Sans Thai Condensed Local";
        src: url("fonts/NotoSansThai-Variable.ttf") format("truetype-variations");
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 62.5% 100%;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #f7f2e8; }
      .asset { display: none; width: 100vw; height: 100vh; }

      .cover {
        position: relative;
        background: #f7f2e8 url("../../public/social/facebook-page/facebook-cover-background.png") center / cover no-repeat;
        color: #171714;
      }
      .cover::before,
      .cover::after {
        content: "";
        position: absolute;
        left: 38%;
        width: 40%;
        height: 2px;
        background: #171714;
      }
      .cover::before { top: 19%; }
      .cover::after { bottom: 18%; background: #b52a22; }
      .cover-copy {
        position: absolute;
        top: 23%;
        left: 37%;
        display: grid;
        width: 42%;
        height: 57%;
        align-content: center;
        text-align: center;
      }
      .cover-kicker {
        margin: 0 0 16px;
        color: #b52a22;
        font-family: "Leelawadee UI", Tahoma, sans-serif;
        font-size: 25px;
        font-weight: 700;
      }
      .cover h1 {
        margin: 0;
        font-family: "Angsana New", "Leelawadee UI", serif;
        font-size: 100px;
        font-weight: 700;
        line-height: .82;
      }
      .cover-period {
        display: inline-flex;
        justify-self: center;
        margin-top: 28px;
        padding: 7px 18px 5px;
        color: #f7f2e8;
        background: #24483c;
        font-family: "Leelawadee UI", Tahoma, sans-serif;
        font-size: 27px;
        font-weight: 700;
      }

      .profile {
        background: #f7f2e8 url("../../public/social/facebook-page/facebook-profile-source.png") center / cover no-repeat;
      }
      .cover-v2 {
        background-image: url("../../public/social/facebook-page/facebook-cover-v2-background.png");
      }
      .cover-v2::before,
      .cover-v2::after {
        left: 30%;
        width: 35%;
      }
      .cover-v2 .cover-copy {
        left: 28%;
        width: 38%;
      }
      .cover-v2 h1 { font-size: 94px; }
      .profile-v2 {
        position: relative;
        display: none;
        background-image: url("../../public/social/facebook-page/facebook-profile-v2-source.png");
      }
      .profile-v2-copy {
        position: absolute;
        top: 48%;
        left: 50%;
        color: #171714;
        font-family: "Angsana New", "Leelawadee UI", serif;
        font-weight: 700;
        line-height: .72;
        text-align: center;
        transform: translate(-50%, -50%);
      }
      .profile-v2-number { display: block; font-size: 224px; }
      .profile-v2-year { display: block; margin-top: 24px; color: #b52a22; font-size: 66px; }
      .profile-v3-copy {
        position: absolute;
        top: 49%;
        left: 50%;
        width: 46%;
        color: #171714;
        text-align: center;
        transform: translate(-50%, -50%);
      }
      .profile-v3-period {
        display: block;
        margin-bottom: 15px;
        color: #b52a22;
        font-family: "Leelawadee UI", Tahoma, sans-serif;
        font-size: 25px;
        font-weight: 700;
      }
      .profile-v3-title {
        display: block;
        font-family: "Angsana New", "Leelawadee UI", serif;
        font-size: 66px;
        font-weight: 700;
        line-height: .82;
      }
      .profile-v3-mark {
        display: inline-block;
        margin-top: 22px;
        padding: 5px 12px 3px;
        color: #f7f2e8;
        background: #24483c;
        font-family: "Angsana New", "Leelawadee UI", serif;
        font-size: 34px;
        font-weight: 700;
        line-height: 1;
      }
      .thai-condensed {
        font-family: "Noto Sans Thai Condensed Local", "Leelawadee UI", sans-serif;
        font-stretch: 62.5%;
        font-variation-settings: "wdth" 62.5, "wght" 800;
      }
      .cover-v3 .cover-kicker,
      .cover-v3 h1,
      .cover-v3 .cover-period {
        font-family: "Noto Sans Thai Condensed Local", "Leelawadee UI", sans-serif;
        font-stretch: 62.5%;
        font-variation-settings: "wdth" 62.5, "wght" 800;
      }
      .cover-v3 h1 {
        font-size: 80px;
        line-height: .94;
      }
      .profile-v4-copy {
        position: absolute;
        top: 49%;
        left: 50%;
        width: 47%;
        color: #171714;
        text-align: center;
        transform: translate(-50%, -50%);
      }
      .profile-v4-period {
        display: block;
        margin-bottom: 18px;
        color: #b52a22;
        font-size: 24px;
        line-height: 1;
      }
      .profile-v4-title {
        display: block;
        font-size: 50px;
        line-height: .92;
      }
      .profile-v4-mark {
        display: inline-block;
        margin-top: 23px;
        padding: 7px 14px 5px;
        color: #f7f2e8;
        background: #24483c;
        font-size: 29px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main class="asset cover" data-mode="cover">
      <div class="cover-copy">
        <p class="cover-kicker">คลังความรู้สาธารณะ</p>
        <h1>ประวัติศาสตร์<br />ประชาชนไทย</h1>
        <p class="cover-period">พ.ศ. 2460–2560</p>
      </div>
    </main>
    <main class="asset profile" data-mode="profile" aria-label="ตราปฏิทินและหนังสือพิมพ์"></main>
    <main class="asset cover cover-v2" data-mode="cover-v2">
      <div class="cover-copy">
        <p class="cover-kicker">คลังความรู้สาธารณะ</p>
        <h1>ประวัติศาสตร์<br />ประชาชนไทย</h1>
        <p class="cover-period">พ.ศ. 2460–2560</p>
      </div>
    </main>
    <main class="asset profile profile-v2" data-mode="profile-v2" aria-label="ปฏิทินหนึ่งร้อยปีและหนังสือพิมพ์ไทย">
      <div class="profile-v2-copy"><span class="profile-v2-number">๑๐๐</span><span class="profile-v2-year">ปี</span></div>
    </main>
    <main class="asset profile profile-v2" data-mode="profile-v3" aria-label="ประวัติศาสตร์ประชาชนไทย พ.ศ. 2460 ถึง 2560">
      <div class="profile-v3-copy">
        <span class="profile-v3-period">พ.ศ. 2460–2560</span>
        <strong class="profile-v3-title">ประวัติศาสตร์<br />ประชาชนไทย</strong>
        <span class="profile-v3-mark">๑๐๐ ปี</span>
      </div>
    </main>
    <main class="asset cover cover-v2 cover-v3" data-mode="cover-v3">
      <div class="cover-copy">
        <p class="cover-kicker">คลังความรู้สาธารณะ</p>
        <h1>ประวัติศาสตร์<br />ประชาชนไทย</h1>
        <p class="cover-period">พ.ศ. 2460–2560</p>
      </div>
    </main>
    <main class="asset profile profile-v2" data-mode="profile-v4" aria-label="ประวัติศาสตร์ประชาชนไทย พ.ศ. 2460 ถึง 2560">
      <div class="profile-v4-copy thai-condensed">
        <span class="profile-v4-period">พ.ศ. 2460–2560</span>
        <strong class="profile-v4-title">ประวัติศาสตร์<br />ประชาชนไทย</strong>
        <span class="profile-v4-mark">๑๐๐ ปี</span>
      </div>
    </main>
    <script>
      const mode = new URLSearchParams(location.search).get("mode") || "cover";
      document.querySelector(`[data-mode="${mode}"]`).style.display = "block";
    </script>
  </body>
</html>
